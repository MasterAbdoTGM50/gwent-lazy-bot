# Install as /etc/systemd/journald.conf.d/retention.conf, then: sudo systemctl restart systemd-journald
[Journal]
# Delete log entries older than 15 days.
MaxRetentionSec=15day
# Start a new journal file daily so old entries are removed in daily chunks
# (journald deletes whole files, so entries can outlive 15 days by up to a day).
MaxFileSec=1day
# Safety cap on disk use.
SystemMaxUse=500M
